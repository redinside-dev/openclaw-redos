name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # allow scanning full history

      - name: Install gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        # Note: action installs gitleaks binary. We'll invoke our wrapper script
        # for a consistent policy surface.

      - name: Run CI secret scan policy
        run: |
          bash scripts/secret_scan/ci_secret_scan.sh
