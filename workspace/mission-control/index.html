<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentOS Mission Control</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: #05060b;
      color: #c8d6e5;
      overflow-x: hidden;
    }
    .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
    .header {
      background: linear-gradient(135deg, #0b0d14 0%, #1a1f2e 100%);
      border: 1px solid #151a28;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 32px; font-weight: 900; color: #38bdf8; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #4ade8015;
      border: 1px solid #4ade8030;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #4ade80;
    }
    .pulse {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(2); opacity: 0; }
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .card {
      background: #0b0d14;
      border: 1px solid #151a28;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.3s ease;
    }
    .card:hover { border-color: #1e293b; transform: translateY(-2px); }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }
    .agent-list { display: flex; flex-direction: column; gap: 12px; }
    .agent-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #10131d;
      border: 1px solid #151a28;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .agent-item:hover { background: #151a28; }
    .agent-info { display: flex; align-items: center; gap: 12px; flex: 1; }
    .agent-icon { font-size: 24px; }
    .agent-details { flex: 1; }
    .agent-name { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .agent-role { font-size: 12px; color: #4a5568; }
    .agent-model { font-size: 11px; color: #6b7280; font-family: 'SF Mono', monospace; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a5568;
    }
    .status-dot.active { background: #4ade80; animation: pulse 2s ease-in-out infinite; }
    .status-dot.running { background: #38bdf8; animation: pulse 2s ease-in-out infinite; }
    .task-list { display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto; }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #10131d;
      border-left: 3px solid transparent;
      border-radius: 6px;
      font-size: 12px;
    }
    .task-item.running { border-left-color: #38bdf8; background: #38bdf815; }
    .task-item.done { border-left-color: #4ade80; opacity: 0.6; }
    .task-item.queued { border-left-color: #4a5568; }
    .task-title { flex: 1; color: #c8d6e5; }
    .task-agent { color: #6b7280; font-size: 11px; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .stat-item { text-align: center; padding: 16px; background: #10131d; border-radius: 8px; }
    .stat-value { font-size: 28px; font-weight: 900; color: #38bdf8; }
    .stat-label { font-size: 11px; color: #4a5568; text-transform: uppercase; margin-top: 4px; }
    .budget-bar {
      height: 8px;
      background: #151a28;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }
    .budget-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ade80 0%, #38bdf8 50%, #f87171 100%);
      transition: width 0.5s ease;
    }
    .budget-text { display: flex; justify-content: space-between; font-size: 11px; color: #6b7280; margin-top: 4px; }
    .refresh-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: #10131d;
      border: 1px solid #151a28;
      border-radius: 20px;
      font-size: 11px;
      color: #4a5568;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #151a28;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .model-usage { display: flex; flex-direction: column; gap: 8px; }
    .model-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    .model-name { width: 120px; color: #c8d6e5; }
    .model-visual {
      flex: 1;
      height: 20px;
      background: #151a28;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .model-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.5s ease;
    }
    .model-count {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: #c8d6e5;
      font-weight: 700;
    }
    .event-log { display: flex; flex-direction: column; gap: 6px; max-height: 500px; overflow-y: auto; font-size: 12px; }
    .event-item {
      padding: 12px;
      background: #10131d;
      border-radius: 4px;
      display: flex;
      gap: 12px;
      border-left: 3px solid #151a28;
      transition: all 0.2s ease;
    }
    .event-item:hover { background: #151a28; }
    .event-item.config_update { border-left-color: #38bdf8; background: #38bdf808; }
    .event-item.error { border-left-color: #f87171; background: #f8717108; }
    .event-item.task { border-left-color: #4ade80; background: #4ade8008; }
    .event-item.status { border-left-color: #6b7280; background: #6b728008; }
    .event-time { color: #4a5568; min-width: 80px; font-weight: 700; }
    .event-type {
      min-width: 100px;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      text-align: center;
    }
    .event-type.config_update { background: #38bdf820; color: #38bdf8; }
    .event-type.error { background: #f8717120; color: #f87171; }
    .event-type.task { background: #4ade8020; color: #4ade80; }
    .event-type.status { background: #6b728020; color: #6b7280; }
    .event-text { color: #c8d6e5; flex: 1; }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    .btn {
      padding: 10px 20px;
      background: #10131d;
      border: 1px solid #151a28;
      border-radius: 8px;
      color: #c8d6e5;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn:hover {
      background: #151a28;
      border-color: #1e293b;
      transform: translateY(-1px);
    }
    .btn.primary {
      background: #38bdf8;
      color: #05060b;
      border-color: #38bdf8;
    }
    .btn.primary:hover {
      background: #0ea5e9;
    }
    .error-banner {
      background: #f8717115;
      border: 1px solid #f8717130;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      color: #f87171;
      font-size: 12px;
    }
    .admin-section { margin-bottom: 24px; }
    .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 16px; }
    .admin-agent {
      padding: 16px;
      background: #10131d;
      border: 1px solid #151a28;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .admin-agent:hover { background: #151a28; }
    .admin-agent-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #151a28;
    }
    .admin-agent-name { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .admin-agent-role { font-size: 12px; color: #6b7280; }
    .form-group { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    select, input {
      width: 100%;
      padding: 10px 12px;
      background: #05060b;
      border: 1px solid #151a28;
      border-radius: 6px;
      color: #c8d6e5;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #38bdf8;
      background: #0b0d14;
    }
    select:hover, input:hover {
      border-color: #1e293b;
    }
    select option {
      background: #0b0d14;
      color: #c8d6e5;
    }
    .tier-badge {
      display: inline-block;
      padding: 2px 6px;
      margin-left: 8px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .tier-5 { background: #f8717120; color: #f87171; }
    .tier-4 { background: #fb923c20; color: #fb923c; }
    .tier-3 { background: #fbbf2420; color: #fbbf24; }
    .tier-2 { background: #4ade8020; color: #4ade80; }
    .tier-1 { background: #38bdf820; color: #38bdf8; }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn.success {
      background: #4ade80;
      color: #05060b;
      border-color: #4ade80;
    }
    .btn.success:hover {
      background: #22c55e;
    }
    .btn.danger {
      background: #f87171;
      color: #05060b;
      border-color: #f87171;
    }
    .btn.danger:hover {
      background: #ef4444;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn:disabled:hover {
      transform: none;
    }
    .status-message {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
      display: none;
    }
    .status-message.show { display: block; }
    .status-message.success {
      background: #4ade8015;
      border: 1px solid #4ade8030;
      color: #4ade80;
    }
    .status-message.error {
      background: #f8717115;
      border: 1px solid #f8717130;
      color: #f87171;
    }
    .activity-log-card {
      background: #0b0d14;
      border: 2px solid #38bdf830;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.1);
    }
    .activity-log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .activity-log-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .fallback-input {
      width: 100%;
      padding: 10px 12px;
      background: #05060b;
      border: 1px solid #151a28;
      border-radius: 6px;
      color: #c8d6e5;
      font-size: 11px;
      font-family: inherit;
    }
    .fallback-hint {
      font-size: 10px;
      color: #6b7280;
      margin-top: 4px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Admin Agent Configuration Component
    function AdminAgentConfig({ agent, config, allModels, status, onUpdate }) {
      const [primary, setPrimary] = useState('');
      const [fallbacks, setFallbacks] = useState('');

      useEffect(() => {
        if (config.primary) {
          setPrimary(config.primary);
        }
        if (config.fallbacks && Array.isArray(config.fallbacks)) {
          setFallbacks(config.fallbacks.join(', '));
        }
      }, [config]);

      const handleUpdate = () => {
        const fallbackArray = fallbacks
          .split(',')
          .map(f => f.trim())
          .filter(f => f.length > 0);

        onUpdate(agent.id, primary, fallbackArray);
      };

      const getTierBadge = (tier) => {
        return <span className={`tier-badge tier-${tier}`}>Tier {tier}</span>;
      };

      return (
        <div className="admin-agent">
          <div className="admin-agent-header">
            <div style={{ fontSize: '24px' }}>{agent.icon}</div>
            <div style={{ flex: 1 }}>
              <div className="admin-agent-name">{agent.name}</div>
              <div className="admin-agent-role">{agent.role}</div>
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Primary Model</label>
            <select
              value={primary}
              onChange={(e) => setPrimary(e.target.value)}
              disabled={status.loading}
            >
              <option value="">Select model...</option>
              {allModels.map((model, i) => (
                <option key={i} value={model.name}>
                  {model.name} {model.tier && `(Tier ${model.tier})`}
                </option>
              ))}
            </select>
          </div>

          <div className="form-group">
            <label className="form-label">Fallback Models</label>
            <input
              type="text"
              className="fallback-input"
              value={fallbacks}
              onChange={(e) => setFallbacks(e.target.value)}
              placeholder="model1, model2, model3"
              disabled={status.loading}
            />
            <div className="fallback-hint">Comma-separated list of fallback models</div>
          </div>

          <div className="btn-group">
            <button
              className="btn success"
              onClick={handleUpdate}
              disabled={status.loading || !primary}
            >
              {status.loading ? 'Updating...' : 'Update Configuration'}
            </button>
          </div>

          {status.success && (
            <div className="status-message success show">
              ✓ {status.message}
            </div>
          )}

          {status.error && (
            <div className="status-message error show">
              ✗ {status.message}
            </div>
          )}
        </div>
      );
    }

    function MissionControl() {
      const [data, setData] = useState({
        agents: [],
        tasks: [],
        budget: { daily: 0, dailyLimit: 2.0, monthly: 0, monthlyLimit: 30.0, fixed: 460 },
        models: [],
        events: [],
        gateway: { status: 'connecting', sessions: 0 },
        error: null
      });
      const [lastUpdate, setLastUpdate] = useState(new Date());
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [availableModels, setAvailableModels] = useState({});
      const [agentConfigs, setAgentConfigs] = useState({});
      const [adminStatus, setAdminStatus] = useState({});
      const [securityData, setSecurityData] = useState({
        active_grants: [],
        pending_requests: [],
        trust_scores: {},
        recent_audit: [],
        compliance: {}
      });
      const eventLogRef = React.useRef(null);

      // Fetch available models
      const fetchModels = async () => {
        try {
          const response = await fetch('http://127.0.0.1:8081/api/models');
          if (response.ok) {
            const models = await response.json();
            setAvailableModels(models);
          }
        } catch (error) {
          console.error('Failed to fetch models:', error);
        }
      };

      // Fetch agent configs
      const fetchConfigs = async () => {
        try {
          const response = await fetch('http://127.0.0.1:8081/api/config');
          if (response.ok) {
            const configs = await response.json();
            setAgentConfigs(configs);
          }
        } catch (error) {
          console.error('Failed to fetch configs:', error);
        }
      };

      // Fetch security data
      const fetchSecurity = async () => {
        try {
          const response = await fetch('http://127.0.0.1:8081/api/security');
          if (response.ok) {
            const data = await response.json();
            setSecurityData(data);
          }
        } catch (error) {
          console.error('Failed to fetch security data:', error);
        }
      };

      // Update agent model configuration
      const updateAgentModel = async (agentId, primary, fallbacks) => {
        const statusKey = agentId;
        setAdminStatus(prev => ({ ...prev, [statusKey]: { loading: true } }));

        try {
          const response = await fetch(`http://127.0.0.1:8081/api/agents/${agentId}/model`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ primary, fallbacks })
          });

          if (response.ok) {
            setAdminStatus(prev => ({
              ...prev,
              [statusKey]: { loading: false, success: true, message: 'Updated successfully!' }
            }));

            // Add event to log
            addEvent('config_update', `Updated ${agentId} model: ${primary} with fallbacks: ${fallbacks.join(', ')}`);

            // Refresh configs
            await fetchConfigs();

            // Clear success message after 3 seconds
            setTimeout(() => {
              setAdminStatus(prev => {
                const newStatus = { ...prev };
                delete newStatus[statusKey];
                return newStatus;
              });
            }, 3000);
          } else {
            throw new Error('Failed to update model');
          }
        } catch (error) {
          setAdminStatus(prev => ({
            ...prev,
            [statusKey]: { loading: false, error: true, message: error.message }
          }));

          // Add error event to log
          addEvent('error', `Failed to update ${agentId} model: ${error.message}`);

          setTimeout(() => {
            setAdminStatus(prev => {
              const newStatus = { ...prev };
              delete newStatus[statusKey];
              return newStatus;
            });
          }, 5000);
        }
      };

      // Add event to log
      const addEvent = (type, message) => {
        const now = new Date();
        const time = now.toLocaleTimeString();
        setData(prev => ({
          ...prev,
          events: [{ time, type, text: message }, ...prev.events.slice(0, 99)]
        }));
      };

      // Clear event log
      const clearEventLog = () => {
        setData(prev => ({ ...prev, events: [] }));
      };

      // Fetch data from OpenClaw API
      const fetchData = async () => {
        setIsRefreshing(true);
        try {
          // Fetch status from Gateway Bridge
          const response = await fetch('http://127.0.0.1:8081/api/status');

          if (!response.ok) {
            throw new Error('Failed to connect to gateway');
          }

          const status = await response.json();

          // Parse and update data
          setData(prev => ({
            agents: parseAgents(status),
            tasks: parseTasks(status),
            budget: parseBudget(status),
            models: parseModels(status),
            events: prev.events.length > 0 ? prev.events : parseEvents(status),
            gateway: { status: 'online', sessions: status.sessions?.length || 0 },
            error: null
          }));
          setLastUpdate(new Date());
        } catch (error) {
          console.error('Fetch error:', error);
          setData(prev => ({
            ...prev,
            gateway: { status: 'offline', sessions: 0 },
            error: error.message
          }));
        }
        setIsRefreshing(false);
      };

      // Parse functions
      const parseAgents = (status) => {
        return [
          { id: 'main', name: 'RED', role: 'CEO', model: 'codex-5.2', status: 'active', color: '#f87171', icon: '🔴' },
          { id: 'allrounder', name: 'ZEN', role: 'CSO', model: 'codex-5.2', status: 'idle', color: '#a78bfa', icon: '🟣' },
          { id: 'hatake', name: 'HATAKE', role: 'Parser', model: 'qwen-2.5', status: 'active', color: '#4ade80', icon: '🟢' },
          { id: 'eng', name: 'ENG', role: 'Engineering', model: 'codex-5.2', status: 'active', color: '#60a5fa', icon: '🔵' },
          { id: 'research', name: 'RESEARCH', role: 'Intelligence', model: 'codex-5.2', status: 'active', color: '#c084fc', icon: '🟣' },
          { id: 'finance', name: 'FINANCE', role: 'Analyst', model: 'codex-5.2', status: 'idle', color: '#2dd4bf', icon: '🟢' },
          { id: 'ops', name: 'OPS', role: 'QA/DevOps', model: 'glm-4.7', status: 'idle', color: '#fbbf24', icon: '🟡' }
        ];
      };

      const parseTasks = (status) => {
        // Mock tasks - in real implementation, parse from status
        return [
          { id: 'T-001', title: 'Parse incoming command', agent: 'HATAKE', status: 'done' },
          { id: 'T-002', title: 'Route to best models', agent: 'RED', status: 'done' },
          { id: 'T-003', title: 'Create project plan', agent: 'RED', status: 'running' },
        ];
      };

      const parseBudget = (status) => {
        return {
          daily: 1.24,
          dailyLimit: 2.0,
          monthly: 18.45,
          monthlyLimit: 30.0,
          fixed: 460
        };
      };

      const parseModels = (status) => {
        return [
          { name: 'Codex gpt-5.2', calls: 42, cost: 0 },
          { name: 'Claude Code', calls: 18, cost: 0 },
          { name: 'Perplexity Pro', calls: 12, cost: 0 },
          { name: 'Z.AI glm-4.7', calls: 8, cost: 1.24 },
          { name: 'Ollama qwen2.5', calls: 5, cost: 0 }
        ];
      };

      const parseEvents = (status) => {
        return [
          { time: '22:30:45', type: 'task', text: 'TASK-003 started by RED (Codex gpt-5.2)' },
          { time: '22:30:42', type: 'status', text: 'Project PROJ-20260212-223045 created' },
          { time: '22:30:35', type: 'task', text: 'Brief parsed by HATAKE' },
          { time: '22:30:32', type: 'status', text: 'Command received from Telegram' }
        ];
      };

      // Auto-refresh every 3 seconds
      useEffect(() => {
        fetchData();
        fetchModels();
        fetchConfigs();
        fetchSecurity();
        const interval = setInterval(fetchData, 3000);
        const secInterval = setInterval(fetchSecurity, 10000);
        return () => { clearInterval(interval); clearInterval(secInterval); };
      }, []);

      // Auto-scroll event log
      useEffect(() => {
        if (eventLogRef.current) {
          eventLogRef.current.scrollTop = 0;
        }
      }, [data.events]);

      const maxCalls = Math.max(...data.models.map(m => m.calls), 1);

      // Get all models as flat list with tier info
      const getAllModels = () => {
        const models = [];
        Object.entries(availableModels).forEach(([tier, tierModels]) => {
          if (Array.isArray(tierModels)) {
            tierModels.forEach(model => {
              models.push({ name: model, tier: tier.replace('tier', '') });
            });
          }
        });
        return models;
      };

      const allModels = getAllModels();

      return (
        <div className="container">
          <div className="refresh-indicator">
            {isRefreshing && <div className="spinner"></div>}
            <span>Last update: {lastUpdate.toLocaleTimeString()}</span>
          </div>

          <div className="header">
            <div className="logo">🦞 AGENTOS MISSION CONTROL</div>
            <div className="status-badge">
              <div className="pulse"></div>
              GATEWAY {data.gateway.status.toUpperCase()}
            </div>
          </div>

          {data.error && (
            <div className="error-banner">
              ⚠️ {data.error} - Using cached data. Retrying...
            </div>
          )}

          {/* Real-Time Activity Log - Enhanced and Prominent */}
          <div className="activity-log-card">
            <div className="activity-log-header">
              <div className="activity-log-title">Real-Time Activity Log</div>
              <button className="btn danger" onClick={clearEventLog}>Clear Log</button>
            </div>
            <div className="event-log" ref={eventLogRef}>
              {data.events.length === 0 ? (
                <div style={{ textAlign: 'center', color: '#4a5568', padding: '20px' }}>
                  No events yet. Activity will appear here in real-time.
                </div>
              ) : (
                data.events.map((event, i) => (
                  <div key={i} className={`event-item ${event.type}`}>
                    <div className="event-time">{event.time}</div>
                    <div className={`event-type ${event.type}`}>{event.type.replace('_', ' ')}</div>
                    <div className="event-text">{event.text}</div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Admin Controls Panel */}
          <div className="admin-section">
            <div className="card">
              <div className="card-title">Agent Model Configuration</div>
              <div className="admin-grid">
                {data.agents.map(agent => {
                  const config = agentConfigs[agent.id] || {};
                  const status = adminStatus[agent.id] || {};

                  return (
                    <AdminAgentConfig
                      key={agent.id}
                      agent={agent}
                      config={config}
                      allModels={allModels}
                      status={status}
                      onUpdate={updateAgentModel}
                    />
                  );
                })}
              </div>
            </div>
          </div>

          {/* Security Dashboard */}
          <div className="admin-section">
            <div className="card">
              <div className="card-title">Security Dashboard</div>
              <div className="stat-grid">
                <div className="stat-item">
                  <div className="stat-value">{securityData.active_grants.length}</div>
                  <div className="stat-label">Active Grants</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{securityData.pending_requests.length}</div>
                  <div className="stat-label">Pending Requests</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{securityData.compliance?.summary?.status || 'N/A'}</div>
                  <div className="stat-label">Security Status</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{securityData.recent_audit.length}</div>
                  <div className="stat-label">Audit Entries Today</div>
                </div>
              </div>

              {/* Trust Scores */}
              <div style={{ marginTop: 20 }}>
                <div className="card-title" style={{ marginBottom: 12, fontSize: 13 }}>Agent Trust Scores</div>
                <div className="agent-list">
                  {Object.entries(securityData.trust_scores).map(([agent, score]) => (
                    <div key={agent} className="agent-item" style={{ padding: '8px 12px' }}>
                      <div className="agent-info">
                        <div className="agent-details">
                          <div className="agent-name" style={{ fontSize: 13 }}>{agent.toUpperCase()}</div>
                        </div>
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div className="budget-bar" style={{ width: 120, height: 8 }}>
                          <div className="budget-fill" style={{
                            width: `${score}%`,
                            background: score >= 80 ? '#4ade80' : score >= 50 ? '#fbbf24' : '#f87171'
                          }}></div>
                        </div>
                        <span style={{
                          fontSize: 12, fontWeight: 700, minWidth: 30, textAlign: 'right',
                          color: score >= 80 ? '#4ade80' : score >= 50 ? '#fbbf24' : '#f87171'
                        }}>{score}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Active Grants */}
              {securityData.active_grants.length > 0 && (
                <div style={{ marginTop: 20 }}>
                  <div className="card-title" style={{ marginBottom: 12, fontSize: 13 }}>Active Access Grants</div>
                  <div className="task-list">
                    {securityData.active_grants.map((grant, i) => (
                      <div key={i} className="task-item running" style={{ padding: '8px 12px' }}>
                        <div className="task-title">{grant.agent} - {grant.request_id}</div>
                        <div className="task-agent">Expires: {new Date(grant.expires_at).toLocaleTimeString()} | Monitor: {grant.monitoring_level}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Recent Audit Log */}
              {securityData.recent_audit.length > 0 && (
                <div style={{ marginTop: 20 }}>
                  <div className="card-title" style={{ marginBottom: 12, fontSize: 13 }}>Recent Audit Log</div>
                  <div className="event-log" style={{ maxHeight: 200 }}>
                    {securityData.recent_audit.slice(-15).reverse().map((entry, i) => (
                      <div key={i} className="event-item" style={{ padding: '4px 8px', fontSize: 11 }}>
                        <div className="event-text">{entry}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>

          <div className="grid">
            <div className="card">
              <div className="card-title">System Status</div>
              <div className="stat-grid">
                <div className="stat-item">
                  <div className="stat-value">{data.agents.filter(a => a.status === 'active').length}</div>
                  <div className="stat-label">Active Agents</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{data.gateway.sessions}</div>
                  <div className="stat-label">Active Sessions</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{data.tasks.filter(t => t.status === 'running').length}</div>
                  <div className="stat-label">Running Tasks</div>
                </div>
                <div className="stat-item">
                  <div className="stat-value">{data.models.length}</div>
                  <div className="stat-label">Models Available</div>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="card-title">Budget Today</div>
              <div className="budget-bar">
                <div className="budget-fill" style={{ width: `${(data.budget.daily / data.budget.dailyLimit) * 100}%` }}></div>
              </div>
              <div className="budget-text">
                <span>${data.budget.daily.toFixed(2)} / ${data.budget.dailyLimit.toFixed(2)}</span>
                <span>{Math.round((data.budget.daily / data.budget.dailyLimit) * 100)}%</span>
              </div>
              <div style={{ marginTop: 16 }}>
                <div className="card-title" style={{ marginBottom: 8 }}>Monthly</div>
                <div className="budget-bar">
                  <div className="budget-fill" style={{ width: `${(data.budget.monthly / data.budget.monthlyLimit) * 100}%` }}></div>
                </div>
                <div className="budget-text">
                  <span>${data.budget.monthly.toFixed(2)} / ${data.budget.monthlyLimit.toFixed(2)}</span>
                  <span>{Math.round((data.budget.monthly / data.budget.monthlyLimit) * 100)}%</span>
                </div>
              </div>
              <div style={{ marginTop: 16, textAlign: 'center', color: '#4a5568', fontSize: 11 }}>
                Fixed Monthly: ${data.budget.fixed.toFixed(2)}
              </div>
            </div>
          </div>

          <div className="grid">
            <div className="card">
              <div className="card-title">Active Agents ({data.agents.length})</div>
              <div className="agent-list">
                {data.agents.map(agent => (
                  <div key={agent.id} className="agent-item">
                    <div className="agent-info">
                      <div className="agent-icon">{agent.icon}</div>
                      <div className="agent-details">
                        <div className="agent-name">{agent.name}</div>
                        <div className="agent-role">{agent.role}</div>
                        <div className="agent-model">{agent.model}</div>
                      </div>
                    </div>
                    <div className={`status-dot ${agent.status}`}></div>
                  </div>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="card-title">Current Tasks ({data.tasks.length})</div>
              <div className="task-list">
                {data.tasks.map(task => (
                  <div key={task.id} className={`task-item ${task.status}`}>
                    <div className="task-title">{task.title}</div>
                    <div className="task-agent">{task.agent}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="grid">
            <div className="card">
              <div className="card-title">Model Usage (Today)</div>
              <div className="model-usage">
                {data.models.map((model, i) => (
                  <div key={i} className="model-bar">
                    <div className="model-name">{model.name}</div>
                    <div className="model-visual">
                      <div className="model-fill" style={{ width: `${(model.calls / maxCalls) * 100}%` }}></div>
                      <div className="model-count">{model.calls} calls</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="card-title">Quick Event Summary</div>
              <div className="event-log" style={{ maxHeight: '250px' }}>
                {data.events.slice(0, 5).map((event, i) => (
                  <div key={i} className={`event-item ${event.type}`}>
                    <div className="event-time">{event.time}</div>
                    <div className={`event-type ${event.type}`}>{event.type.replace('_', ' ')}</div>
                    <div className="event-text">{event.text}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">Controls</div>
            <div className="controls">
              <button className="btn primary" onClick={() => fetchData()}>Refresh Now</button>
              <button className="btn" onClick={() => window.open('http://127.0.0.1:18789/', '_blank')}>Open Gateway Dashboard</button>
              <button className="btn" onClick={() => window.location.href = '/logs'}>View Full Logs</button>
              <button className="btn" onClick={() => alert('Settings coming soon!')}>Settings</button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<MissionControl />, document.getElementById('root'));
  </script>
</body>
</html>
