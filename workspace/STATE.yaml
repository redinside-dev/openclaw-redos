# ─── L4 launchd safety-net plist (T52) ─────────────────────────────────────
phase_c_l4_launchd_safety_net:
  status: ACTIVE
  deployed_at: 2026-06-08T20:43:00Z
  deployed_by: main
  reason: |
    The supervisor-tick cron (L4 self-healing) is itself a cron job and could
    break if the cron pipeline stalls. A launchd plist now runs the same
    supervisor-tick.sh every 5 min as an OUT-OF-BAND safety net: if the
    scheduler dies, launchd keeps ticking.
  plist_path: "~/Library/LaunchAgents/ai.openclaw.supervisor-fallback.plist"
  mirrored_at: "launchd/ai.openclaw.supervisor-fallback.plist"
  schedule: "StartInterval=300s (5 min), RunAtLoad=true"
  verification: |
    - bootstrap gui/501/ai.openclaw.supervisor-fallback: OK
    - launchctl list: ai.openclaw.supervisor-fallback registered, exit=-15 (idle)
    - direct run of supervisor-tick.sh: 20:43:05 tick OK — gateway=up cron_jobs=75 workers=8 healed=0
    - will begin periodic firing on its own 5-min schedule without further input
  notes:
    - "kickstart -k hangs in this TTY (env bug, unrelated) — bootstrap loaded the plist, which is sufficient"
    - "exit code -15 in launchctl list = SIGTERM, expected for periodic agents between fires"
