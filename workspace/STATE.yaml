# ─── LEGACY DIAGNOSTIC (T29, 2026-06-08 14:58 EDT) ────────────────────────────
diagnostic_t29:
  hypothesis: "Gateway is restarting hourly, killing cron jobs"
  verdict: REJECTED
  evidence:
    - "launchd restart log shows ONE restart on 2026-05-28 (mode=reload, triggered by 2026.6.1 upgrade). NO restarts since."
    - "Gateway pid 93095 has uptime 09:38 — single uninterrupted run since the upgrade."
    - "gateway.err.log last 30 lines show May 28 08:35 crash, no entries after that — gateway is not actively logging to that file (new 2026.6.1 logs go elsewhere)."
    - "Today's 235 cron_run_logs: 0 errors in the last 4 hours of activity. L0/L1 firing on schedule every 5 min, all ok."
  real_root_cause: |
    Three independent issues are being conflated under "gateway restart":
    1. May 28 config crash: `Invalid config at openclaw.json: plugins: Unrecognized key: "bundledDiscovery"`.
       Cause: 2026.5.27 binary wrote a config key the 2026.5.28 binary rejected. Fixed by upgrading to 2026.6.1.
    2. The "cron: job interrupted by gateway restart" error is openclaw's startup recovery — it marks any
       job whose `state.runningAtMs` was set at startup as failed, regardless of cause (real crash,
       code reload, package upgrade). This is by design, but the error message is misleading.
    3. The 60-min cap in `DEFAULT_ERROR_BACKOFF_SCHEDULE_MS = [30s, 1m, 5m, 15m, 60m]` means a job
       that accumulates 5+ consecutive errors runs once/hour forever. 18 jobs are now in this state
       from the May 28 cascade — their `consecutive_errors` was never reset.
  health_actually:
    gateway: "UP (pid 93095, 09:38 uptime, /health ok)"
    crons_today_ok: 235
    crons_today_error: 0
    stuck_in_backoff: 18
    ollama: "RUNNING (port 11434) but NO MODELS loaded — `ollama list` is empty. Latent issue: any Ollama-direct job will fail; pulse is currently treating this as 'healthy' because /api/tags returns 200 with empty list."

